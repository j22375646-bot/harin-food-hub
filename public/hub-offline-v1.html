<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>연결 확인 · 하린식품 허브</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #f7f4ff; color: #29243b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 560px; padding: clamp(24px, 5vw, 40px); background: #fff; border: 1px solid #ddd5ed; border-radius: 24px; }
    .brand { margin: 0 0 24px; font-size: 16px; color: #6f63bd; font-weight: 700; }
    h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.4; margin: 0 0 20px; word-break: keep-all; }
    p { font-size: 17px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
    a { display: inline-block; padding: 13px 20px; margin-top: 12px; border-radius: 12px; background: #6f63bd; color: #fff; font-size: 17px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #b9a3ff; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      :root { background: #191621; color: #f0ebfa; }
      main { background: #242030; border-color: #514762; }
      .brand { color: #c7bafb; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">하린식품 허브</p>
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>지금은 데이터를 새로고침할 수 없습니다. 이 화면에는 주문·매출 등 업무 데이터가 저장되어 있지 않습니다.</p>
    <p>배송·환불·기타 변경 작업은 인터넷 연결이 필요합니다. 연결이 복구되면 최신 데이터를 확인한 뒤 작업해 주세요.</p>
    <a href="/">연결 후 다시 열기</a>
  </main>
</body>
</html>
